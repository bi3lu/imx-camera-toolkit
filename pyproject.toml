[project]
name = "imx-camera-toolkit"
version = "0.3.1"
description = "CSI IMX camera capture, control, and streaming toolkit for NVIDIA Jetson"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
imx-camera-toolkit = "packages.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
force-include = {
    "view/advanced.html" = "view/advanced.html",
    "view/simple.html" = "view/simple.html",
}

[tool.hatch.build.targets.wheel]
packages = ["packages", "imx_camera_toolkit"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: verifies components working together without physical camera hardware.",
    "benchmark: measures capture or streaming throughput; excluded from normal CI.",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["imx_camera_toolkit", "packages"]

[tool.ruff.lint.per-file-ignores]
"packages/api/api.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["imx_camera_toolkit", "packages", "tests"]
strict = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = ["cv2", "gi", "gi.repository", "yaml"]
ignore_missing_imports = true
