name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: uv sync --extra preview --group dev --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict type check
        run: uv run mypy imx_camera_toolkit packages tests
      - name: Audit locked dependencies
        run: uv audit --frozen

  tests:
    name: Host unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: uv sync --extra preview --group dev --frozen
      - name: Run tests that require no Jetson hardware
        run: >-
          uv run pytest tests/unit tests/integration
          -m "not hardware and not benchmark"
          --cov=packages --cov-report=term-missing

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.14"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Build wheel and source distribution
        run: uv build
      - name: Export CycloneDX SBOM
        run: >-
          uv export --all-extras --format cyclonedx1.5 --frozen
          --output-file dist/sbom.cdx.json
