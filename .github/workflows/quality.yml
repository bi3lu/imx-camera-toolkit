name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-types:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv sync --extra preview --group dev --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict type check
        run: uv run mypy imx_camera_toolkit packages tests

  tests:
    name: Host unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv sync --extra preview --group dev --frozen
      - name: Run tests that require no Jetson hardware
        run: >-
          uv run pytest tests/unit tests/integration
          -m "not hardware and not benchmark"
          --cov=packages --cov-report=term-missing

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build wheel and source distribution
        run: uv build
