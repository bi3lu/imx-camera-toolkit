name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distribution
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imx-camera-toolkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.14"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Verify release tag matches package version
        run: |
          package_version="$(uv version --short)"
          if [ "v${package_version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify installed wheel version matches release tag
        run: |
          consumer_dir=$(mktemp -d)
          uv venv --python "$(command -v python)" "$consumer_dir/venv"
          uv pip install --python "$consumer_dir/venv/bin/python" "$PWD"/dist/*.whl
          cd "$consumer_dir"
          "$consumer_dir/venv/bin/python" -I - <<'PY'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import imx_camera_toolkit

          package = Path(imx_camera_toolkit.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix).resolve()), package
          installed_version = version("imx-camera-toolkit")
          assert imx_camera_toolkit.__version__ == installed_version
          assert os.environ["GITHUB_REF_NAME"] == f"v{installed_version}"
          PY
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
