name: Jetson hardware validation

on:
  workflow_dispatch:
    inputs:
      sensor:
        description: Connected CSI sensor
        required: true
        type: choice
        options:
          - IMX219
          - IMX477
      sensor_id:
        description: Argus sensor identifier
        required: true
        default: "0"
        type: string
      onnx_model_path:
        description: Absolute ONNX path already present on the Jetson runner
        required: true
        type: string
      benchmark_seconds:
        description: Production preview benchmark duration
        required: true
        default: "10"
        type: string

concurrency:
  group: jetson-camera-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardware:
    name: Camera, TensorRT, and production preview
    runs-on: [self-hosted, Linux, ARM64, jetson]
    timeout-minutes: 45
    env:
      IMX_CAMERA_SENSOR: ${{ inputs.sensor }}
      IMX_CAMERA_SENSOR_ID: ${{ inputs.sensor_id }}
      IMX_TENSORRT_ONNX: ${{ inputs.onnx_model_path }}
      IMX_PREVIEW_BENCHMARK_SECONDS: ${{ inputs.benchmark_seconds }}
      IMX_PRODUCTION_PREVIEW_HARDWARE: "1"
      IMX_TENSORRT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Verify runner model and Jetson tools
        run: |
          test -f "$IMX_TENSORRT_ONNX"
          command -v tegrastats
          gst-inspect-1.0 nvarguscamerasrc nvv4l2h264enc
      - name: Create environment with JetPack system packages
        run: |
          uv venv --system-site-packages --allow-existing .venv
          uv sync --extra production-preview --extra tensorrt-test --group dev --frozen
      - name: Build NvBufSurface and CUDA interop
        run: uv run imx-camera-build-interop
      - name: Run physical camera and encoder tests
        run: uv run pytest -m hardware tests/hardware
      - name: Compare TensorRT and ONNX Runtime outputs
        run: uv run pytest tests/integration/test_tensorrt_onnx_parity.py
      - name: Record 720p and 1080p resource report
        run: >-
          uv run imx-camera benchmark jetson --resolution all --backend all
          --frames 300 --fps 30 --json
