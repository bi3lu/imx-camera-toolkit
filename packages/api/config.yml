# Default FastAPI application settings.
#
# This file is loaded when create_app() is called. If it is missing, unreadable,
# malformed, or contains invalid values, the built-in defaults are used.
# Pass config_path to create_app() to load another file.

api_config:
  # Metadata displayed in the OpenAPI schema and interactive API documentation.
  title: IMX Camera API
  description: Snapshots and MJPEG streaming for an NVIDIA Jetson CSI camera.
  version: 0.3.1

  # Maximum time, in seconds, that the snapshot endpoint waits for a newer frame.
  snapshot_timeout: 2.0
