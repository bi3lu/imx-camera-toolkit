# Default CSI IMX camera settings for NVIDIA Jetson.
#
# This file is loaded automatically when Camera() is created without an explicit
# CameraConfig. If it is missing, unreadable, malformed, or contains an invalid
# value, the built-in defaults are used safely. Prefer CameraConfig in new code
# when the configuration should be explicit and portable between applications.

camera_config:
  # JPEG encoding quality: 0 (smallest file) .. 100 (best quality).
  quality: 65

  # CSI camera number (0 for the first sensor, 1 for the second).
  sensor_id: 0

  # Resolution captured from the sensor by nvarguscamerasrc, in pixels.
  capture_width: 1920
  capture_height: 1080

  # BGR resolution passed to OpenCV and the JPEG encoder, in pixels.
  output_width: 1280
  output_height: 720

  # Compatible Camera output path. BGR_CPU converts the sensor's NV12/NVMM
  # frames to BGR, downloads them to host RAM, and materializes an owned array.
  # GPU capture uses a separate API and must not be selected here.
  output_format: BGR_CPU

  # Number of frames captured from the sensor per second.
  fps: 30

  # Image rotation/mirroring for nvvidconv: an integer from 0 to 7.
  # 0 means no transformation.
  flip_method: 0

  # Optional Argus sensor mode. Use null to let Argus choose automatically.
  sensor_mode: null

  # JPEG is intended only for browser preview and streaming. Keep it disabled
  # for raw-frame-only applications to avoid JPEG encoding overhead.
  enable_preview: false

  # Maximum number of JPEG frames encoded per second. Use null to match fps.
  # This option is relevant only when enable_preview is true.
  max_fps: null
