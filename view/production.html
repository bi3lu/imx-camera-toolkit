<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMX Production Preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #090b0f; }
    body { display: grid; place-items: center; font: 14px system-ui, sans-serif; }
    video { width: min(100vw, 1280px); max-height: 100vh; background: #000; }
    #status { position: fixed; top: 12px; left: 12px; color: #fff;
      background: #000a; padding: 6px 9px; border-radius: 5px; }
    #login { position: fixed; inset: 0; display: grid; place-items: center;
      background: #090b0fee; color: #fff; }
    #login[hidden] { display: none; }
    #login form { display: grid; gap: 12px; width: min(88vw, 360px);
      padding: 24px; border-radius: 8px; background: #171b22; }
    #login input, #login button { box-sizing: border-box; width: 100%;
      padding: 10px; font: inherit; }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline controls></video>
  <div id="status">Connecting…</div>
  <div id="login" hidden>
    <form id="login-form">
      <label for="token">Device access token</label>
      <input id="token" name="token" type="password" autocomplete="off" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const video = document.getElementById("preview");
    const status = document.getElementById("status");
    const login = document.getElementById("login");
    const loginForm = document.getElementById("login-form");
    const tokenInput = document.getElementById("token");
    let clientId = null;
    let peer = null;
    let candidateCursor = 0;
    let candidateTimer = null;
    let statsTimer = null;
    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let generation = 0;
    let connecting = false;
    let stopped = false;
    let lastMediaProgressAt = performance.now();
    let lastPacketsReceived = 0;

    class HttpError extends Error {
      constructor(statusCode, message) {
        super(message);
        this.statusCode = statusCode;
      }
    }

    async function request(path, options = {}) {
      const response = await fetch(path, options);
      if (!response.ok) {
        throw new HttpError(response.status, await response.text());
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function clearTimers() {
      clearTimeout(candidateTimer);
      clearTimeout(statsTimer);
      candidateTimer = null;
      statsTimer = null;
    }

    function closeSession() {
      clearTimers();
      const oldClientId = clientId;
      clientId = null;
      candidateCursor = 0;
      if (peer) peer.close();
      peer = null;
      video.onerror = null;
      video.srcObject = null;
      video.removeAttribute("src");
      if (oldClientId) {
        fetch(`/api/preview/session/${oldClientId}`, {
          method: "DELETE", keepalive: true
        }).catch(() => {});
      }
    }

    function scheduleReconnect(reason) {
      if (stopped || reconnectTimer) return;
      generation += 1;
      connecting = false;
      closeSession();
      const delay = Math.min(500 * (2 ** reconnectAttempt), 8000);
      reconnectAttempt += 1;
      status.textContent = `${reason}; reconnecting in ${delay} ms`;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect().catch(handleConnectionError);
      }, delay);
    }

    function requireLogin(reason = "Authentication required") {
      generation += 1;
      connecting = false;
      closeSession();
      login.hidden = false;
      status.textContent = reason;
      tokenInput.focus();
    }

    function handleConnectionError(error) {
      if (error.statusCode === 401 || error.statusCode === 403) {
        requireLogin(error.statusCode === 403
          ? "Token does not grant stream access"
          : "Authentication required");
        return;
      }
      scheduleReconnect(`Preview error: ${error}`);
    }

    async function pollCandidates(sessionGeneration) {
      if (sessionGeneration !== generation || !clientId || !peer) return;
      const activeClientId = clientId;
      const activePeer = peer;
      try {
        const response = await request(
          `/api/preview/webrtc/${activeClientId}/candidates?after=${candidateCursor}`
        );
        if (sessionGeneration !== generation || peer !== activePeer) return;
        for (const candidate of response.candidates) {
          await activePeer.addIceCandidate(candidate);
        }
        candidateCursor = response.next;
        candidateTimer = setTimeout(
          () => pollCandidates(sessionGeneration), 250
        );
      } catch (error) {
        if (error.statusCode === 401 || error.statusCode === 403) {
          requireLogin("Authentication expired");
        } else if (error.statusCode === 404 || error.statusCode === 410) {
          scheduleReconnect("Signaling session expired");
        } else {
          scheduleReconnect(`Candidate polling failed: ${error}`);
        }
      }
    }

    async function updateMediaStats(sessionGeneration) {
      if (sessionGeneration !== generation || !peer) return;
      const activeClientId = clientId;
      const activePeer = peer;
      let packetsReceived = 0;
      let bytesReceived = 0;
      let framesReceived = 0;
      let framesDecoded = 0;
      let packetsLost = 0;
      let jitterMs = null;
      let rttMs = null;
      for (const report of (await activePeer.getStats()).values()) {
        if (report.type === "inbound-rtp" &&
            (report.kind ?? report.mediaType) === "video") {
          packetsReceived += report.packetsReceived || 0;
          bytesReceived += report.bytesReceived || 0;
          framesReceived += report.framesReceived || 0;
          framesDecoded += report.framesDecoded || 0;
          packetsLost += report.packetsLost || 0;
          if (Number.isFinite(report.jitter)) jitterMs = report.jitter * 1000;
        }
        if (report.type === "remote-inbound-rtp" &&
            Number.isFinite(report.roundTripTime)) {
          rttMs = report.roundTripTime * 1000;
        }
      }
      if (sessionGeneration !== generation || peer !== activePeer) return;
      if (packetsReceived > lastPacketsReceived) {
        lastMediaProgressAt = performance.now();
        lastPacketsReceived = packetsReceived;
      }
      const idleSeconds = (performance.now() - lastMediaProgressAt) / 1000;
      let mediaState = packetsReceived > 0 ? "active" : "starting";
      if (idleSeconds > 4) mediaState = packetsReceived > 0 ? "stalled" : "failed";
      status.textContent =
        `WebRTC: ${activePeer.connectionState}; media ${mediaState}; ` +
        `packets ${packetsReceived}; bytes ${bytesReceived}; ` +
        `frames ${framesReceived}/${framesDecoded}; idle ${idleSeconds.toFixed(1)}s`;
      request(`/api/preview/webrtc/${activeClientId}/feedback`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          packets_received: packetsReceived,
          bytes_received: bytesReceived,
          frames_received: framesReceived,
          frames_decoded: framesDecoded,
          packets_lost: packetsLost,
          jitter_ms: jitterMs,
          rtt_ms: rttMs
        })
      }).catch(error => {
        if (error.statusCode === 404 || error.statusCode === 410) {
          scheduleReconnect("Signaling session expired");
        }
      });
      statsTimer = setTimeout(() => updateMediaStats(sessionGeneration), 1000);
    }

    async function connect() {
      if (stopped || connecting) return;
      connecting = true;
      closeSession();
      const sessionGeneration = ++generation;
      const session = await request("/api/preview/session", {method: "POST"});
      if (sessionGeneration !== generation) {
        fetch(`/api/preview/session/${session.client_id}`, {
          method: "DELETE"
        }).catch(() => {});
        return;
      }
      clientId = session.client_id;
      if (session.transport === "hls") {
        video.src = session.playlist_url;
        status.textContent = "HLS";
        video.onerror = () => scheduleReconnect("HLS media failed");
        await video.play().catch(error => {
          status.textContent = `HLS playback blocked: ${error}`;
        });
        connecting = false;
        reconnectAttempt = 0;
        return;
      }

      peer = new RTCPeerConnection();
      const sessionPeer = peer;
      const sessionClientId = clientId;
      sessionPeer.ontrack = event => {
        const stream = event.streams[0] ?? new MediaStream([event.track]);
        video.srcObject = stream;
        video.play().catch(error => {
          status.textContent = `Playback blocked: ${error}`;
        });
      };
      sessionPeer.onconnectionstatechange = () => {
        if (sessionGeneration !== generation) return;
        if (sessionPeer.connectionState === "connected") reconnectAttempt = 0;
        if (["failed", "disconnected"].includes(sessionPeer.connectionState)) {
          scheduleReconnect(`WebRTC ${sessionPeer.connectionState}`);
        }
      };
      sessionPeer.onicecandidate = event => {
        if (sessionGeneration !== generation) return;
        if (!event.candidate) return;
        request(`/api/preview/webrtc/${sessionClientId}/candidate`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(event.candidate.toJSON())
        }).catch(error => {
          if (error.statusCode === 404 || error.statusCode === 410) {
            scheduleReconnect("Signaling session expired");
          } else {
            console.error(error);
          }
        });
      };
      await sessionPeer.setRemoteDescription(session.offer);
      const answer = await sessionPeer.createAnswer();
      await sessionPeer.setLocalDescription(answer);
      await request(`/api/preview/webrtc/${sessionClientId}/answer`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(answer)
      });
      connecting = false;
      lastMediaProgressAt = performance.now();
      lastPacketsReceived = 0;
      pollCandidates(sessionGeneration);
      updateMediaStats(sessionGeneration);
    }

    addEventListener("beforeunload", () => {
      stopped = true;
      clearTimeout(reconnectTimer);
      closeSession();
    });
    loginForm.addEventListener("submit", async event => {
      event.preventDefault();
      const token = tokenInput.value;
      tokenInput.value = "";
      status.textContent = "Signing in…";
      try {
        const response = await fetch("/auth/session", {
          method: "POST",
          headers: {Authorization: `Bearer ${token}`}
        });
        if (!response.ok) {
          throw new HttpError(response.status, await response.text());
        }
        login.hidden = true;
        reconnectAttempt = 0;
        connect().catch(handleConnectionError);
      } catch (error) {
        requireLogin(`Sign-in failed: ${error}`);
      }
    });
    connect().catch(handleConnectionError);
  </script>
</body>
</html>
